name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate static site
        run: pnpm generate

      # Download this artifact from the run page, unzip it and run `npx serve` inside it to preview the site.
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: .output/public
          retention-days: 14
